<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3;url=https://banthachaom-school.github.io/">
  <link rel="canonical" href="https://banthachaom-school.github.io/">
  <title>ย้ายระบบงานโรงเรียนบ้านท่าชะอม</title>
  <style>
    body{font-family:system-ui,-apple-system,"Sarabun",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:#1f2937}
    main{max-width:34rem;margin:1.5rem;padding:2rem;border:1px solid #e5e7eb;border-radius:1rem;background:#fff;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    h1{font-size:1.45rem;margin:.25rem 0 1rem}p{line-height:1.7}a{display:inline-block;margin-top:.75rem;padding:.75rem 1rem;border-radius:.75rem;background:#166534;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>ระบบงานย้ายไปเว็บไซต์ของโรงเรียนแล้ว</h1>
    <p>กำลังพาไปยังเว็บไซต์ใหม่ของโรงเรียนบ้านท่าชะอมโดยอัตโนมัติ</p>
    <a href="https://banthachaom-school.github.io/">เปิดเว็บไซต์โรงเรียน</a>
  </main>
  <script>
    (async function () {
      var target = 'https://banthachaom-school.github.io/';
      try {
        if ('serviceWorker' in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(function (registration) {
            return new URL(registration.scope).pathname.indexOf('/Banthacha-om-School/') === 0;
          }).map(function (registration) { return registration.unregister(); }));
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.filter(function (key) {
            return key.indexOf('banthacha-om-') === 0;
          }).map(function (key) { return caches.delete(key); }));
        }
      } catch (_) {}
      window.location.replace(target);
    })();
  </script>
</body>
</html>
